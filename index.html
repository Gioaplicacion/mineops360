<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Global Mine Planner</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.0/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e14;--sur:#0f141c;--card:#111827;--brd:#1f2937;--txt:#e2eaf4;--txt2:#6b8099;--acc:#00d4ff;--ore:#00b8d9;--gold:#38bdf8;--danger:#f87171;}
html,body,#root{height:100%;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--sur)}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
input,select,button,a{font-family:inherit}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#1a6eb8;font-size:15px">Cargando Global Mine Planner...</div></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API = "https://mineops360-production.up.railway.app";

const METALS = [
  {sym:"Cu",name:"Cobre",    unit:"%",   col:"#e07820",presets:[0,.2,.4,.6,.8],  colors:["#b8c2d4","#f0c040","#f07830","#e03020","#9b1fff"]},
  {sym:"Au",name:"Oro",      unit:"g/t", col:"#f5c518",presets:[0,.5,1,2,5],     colors:["#b8c2d4","#ffe066","#ffa500","#e03020","#8b0000"]},
  {sym:"Ag",name:"Plata",    unit:"g/t", col:"#aab8cc",presets:[0,10,30,60,100], colors:["#b8c2d4","#c0e0ff","#4499dd","#1a6eb8","#0a2a60"]},
  {sym:"Ni",name:"Níquel",   unit:"%",   col:"#7ab87a",presets:[0,.3,.6,1,1.5],  colors:["#b8c2d4","#b0e8b0","#4db84d","#1a7a1a","#0a3a0a"]},
  {sym:"Li",name:"Litio",    unit:"%",   col:"#e066ff",presets:[0,.3,.6,1,1.5],  colors:["#b8c2d4","#f0c0ff","#c060e0","#8020c0","#400060"]},
  {sym:"Co",name:"Cobalto",  unit:"%",   col:"#4466ff",presets:[0,.05,.1,.2,.4], colors:["#b8c2d4","#aac0ff","#4466ee","#1133cc","#001188"]},
  {sym:"Zn",name:"Zinc",     unit:"%",   col:"#88aacc",presets:[0,1,3,6,10],     colors:["#b8c2d4","#c0d8f0","#6699cc","#336699","#0a2244"]},
  {sym:"Mg",name:"Magnesio", unit:"%",   col:"#44ccaa",presets:[0,5,10,20,35],   colors:["#b8c2d4","#aaf0e0","#20c090","#0a7a60","#003830"]},
  {sym:"Fe",name:"Hierro",   unit:"%",   col:"#cc4422",presets:[0,20,40,55,65],  colors:["#b8c2d4","#ffccaa","#ee7744","#cc3311","#660000"]},
  {sym:"Mo",name:"Molibdeno",unit:"%",   col:"#cc8844",presets:[0,.02,.05,.1,.2],colors:["#b8c2d4","#f8ddb0","#e0a040","#c06010","#6a2000"]},
];
const QUICK = ["Cu","Au","Ag","Ni","Li","Co"];
const NX=18,NY=14,NZ=10,BS=20,BZ=15;

function defaultRangos(sym){
  const m=METALS.find(x=>x.sym===sym)||METALS[0];
  return m.presets.map((min,i)=>({min,max:m.presets[i+1]??Infinity,color:m.colors[i]}));
}
function hexRgb(h){return[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}
function colorForLey(ley,rangos,oor){
  for(const r of rangos)if(ley>=r.min&&ley<(r.max===Infinity?1e9:r.max))return hexRgb(r.color);
  return hexRgb(oor||"#b8c2d4");
}
const DEMO=(()=>{const b=[];let s=7;const rng=x=>{const v=Math.sin(x+1)*99991;return v-Math.floor(v)};
  for(let iz=0;iz<NZ;iz++)for(let iy=0;iy<NY;iy++)for(let ix=0;ix<NX;ix++){s++;
    const dist=Math.hypot(ix-NX/2,iy-NY/2),zf=1-(iz/NZ)*.3;
    const rawLey=Math.max(0,(0.58-dist*.034)*zf+rng(s++)*.14-.04+(rng(s++)-.5)*.07);
    b.push({ix,iy,iz,rawLey,fase:Math.min(4,1+Math.floor(dist/3.5+(iz/NZ)*1.5)),per:Math.min(30,Math.floor(dist*.8+(NZ-iz)*.4+3+rng(s++)*4)+1),ton:BS*BS*BZ*2.5})
  }return b})();
const STAGES=[{label:"Modelo",f:()=>true},{label:"¿Cuánto?",f:(b)=>{const cx=NX/2,cy=NY/2,pr=1-(b.iz/NZ);return Math.hypot(b.ix-cx,b.iy-cy)<(NX/2)*(1-pr*0.65);}},{label:"¿Cómo? Pit",f:(b)=>{const cx=NX/2,cy=NY/2,pr=1-(b.iz/NZ);return Math.hypot(b.ix-cx,b.iy-cy)<(NX/2-1)*(1-pr*0.72);}},{label:"¿Cómo? Fases",f:b=>b.fase<=4},{label:"¿Cuándo?",f:b=>b.per>0}];

// ── Viewer3D ────────────────────────────────────────────────────
function Viewer3D({metalConfig,pitSelecto,totalPits,realBlocks,loadingBlocks}){
  const cvRef=useRef(),threeRef=useRef({});
  const [stage,setStage]=useState(0),[zSlice,setZSlice]=useState(0),[zMax,setZMax]=useState(100),[hovered,setHovered]=useState(null);
  const zSliceRef=useRef(0);
  const zMaxRef=useRef(100);
  const cfgRef=useRef(metalConfig);
  useEffect(()=>{cfgRef.current=metalConfig},[metalConfig]);
  const pitSelectoRef=useRef(null);
  const totalPitsRef=useRef(20);
  const realBlocksRef=useRef(null);
  useEffect(()=>{pitSelectoRef.current=pitSelecto;totalPitsRef.current=totalPits||20;rebuild();},[pitSelecto,totalPits]);
  useEffect(()=>{realBlocksRef.current=realBlocks||null;if(realBlocks)rebuild();},[realBlocks]);
  useEffect(()=>{zSliceRef.current=zSlice;rebuild();},[zSlice]);
  useEffect(()=>{zMaxRef.current=zMax;rebuild();},[zMax]);

  const rebuild=useCallback(()=>{
    const{pivot}=threeRef.current;if(!pivot)return;
    while(pivot.children.length)pivot.remove(pivot.children[0]);
    const geo=new THREE.BoxGeometry(BS*.86,BZ*.83,BS*.86);
    const ox=(NX-1)*BS/2,oy=(NY-1)*BS/2,oz=(NZ-1)*BZ/2;
    const meshes=[],cfg=cfgRef.current;
    const rangos=cfg?.rangos||[],oor=cfg?.oorColor||"#b8c2d4";
    const mx=((cfg?.metal?.presets||[.8])[((cfg?.metal?.presets||[.8]).length-1)]||.8)*1.5;
    DEMO.forEach(b=>{
      const _izPct=(b.iz/(NZ-1))*100; if(_izPct<zSliceRef.current||_izPct>zMaxRef.current)return;
      // Filtro por pit selecto: pit más pequeño = cono más chico
      const _ps=pitSelectoRef.current;
      if(_ps){
        const _nPits=totalPitsRef.current||20;
        const _rf=_ps/_nPits; // Revenue Factor del pit selecto
        const _cx=NX/2,_cy=NY/2;
        const _pr=1-(b.iz/NZ);
        const _radio=(_rf*(NX/2))*(1-_pr*0.65);
        if(Math.hypot(b.ix-_cx,b.iy-_cy)>_radio)return;
      }
      if(!STAGES[stage].f(b))return;
      const ley=(b.rawLey/.8)*mx;
      const[r,g,bv]=colorForLey(ley,rangos,oor);
      const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:new THREE.Color(r,g,bv)}));
      m.position.set(b.ix*BS-ox,b.iz*BZ-oz,b.iy*BS-oy);
      m.userData={...b,ley};pivot.add(m);meshes.push(m);
    });
    threeRef.current.meshes=meshes;
  },[stage,zSlice,zMax]);

  useEffect(()=>{
    if(typeof THREE==="undefined")return;
    const cv=cvRef.current;if(!cv)return;
    const W=cv.clientWidth||600,H=360;
    const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(W,H,false);
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x070a10);
    scene.add(new THREE.AmbientLight(0xd0daf0,.8));
    const d1=new THREE.DirectionalLight(0xffffff,.75);d1.position.set(2,3,4);scene.add(d1);
    const cam=new THREE.PerspectiveCamera(45,W/H,1,5000);cam.position.set(0,0,700);
    const pivot=new THREE.Group();scene.add(pivot);
    threeRef.current={renderer,scene,cam,pivot,meshes:[],rot:{x:.42,y:.58},zoom:1,drag:false,last:{x:0,y:0}};
    const onD=e=>{threeRef.current.drag=true;threeRef.current.last={x:e.clientX,y:e.clientY}};
    const onU=()=>threeRef.current.drag=false;
    const onM=e=>{const s=threeRef.current;if(!s.drag)return;s.rot.y+=(e.clientX-s.last.x)*.009;s.rot.x+=(e.clientY-s.last.y)*.009;s.rot.x=Math.max(-1.4,Math.min(1.4,s.rot.x));s.last={x:e.clientX,y:e.clientY}};
    const onW=e=>{threeRef.current.zoom=Math.max(.3,Math.min(3.5,threeRef.current.zoom+e.deltaY*.001));e.preventDefault()};
    cv.addEventListener("mousedown",onD);window.addEventListener("mouseup",onU);window.addEventListener("mousemove",onM);cv.addEventListener("wheel",onW,{passive:false});
    cv.addEventListener("click",e=>{
      const rect=cv.getBoundingClientRect();
      const mv=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
      const ray=new THREE.Raycaster();ray.setFromCamera(mv,threeRef.current.cam);
      const hits=ray.intersectObjects(threeRef.current.meshes||[]);
      if(hits.length)setHovered(hits[0].object.userData);
    });
    new ResizeObserver(()=>{const w=cv.clientWidth;renderer.setSize(w,H,false);cam.aspect=w/H;cam.updateProjectionMatrix()}).observe(cv);
    let raf;const loop=()=>{raf=requestAnimationFrame(loop);const s=threeRef.current;s.pivot.rotation.x=s.rot.x;s.pivot.rotation.y=s.rot.y;s.cam.position.z=700/s.zoom;renderer.render(scene,cam)};
    loop();
    return()=>{cancelAnimationFrame(raf);renderer.dispose()};
  },[]);

  useEffect(()=>{rebuild()},[rebuild]);
  useEffect(()=>{rebuild()},[metalConfig]);

  const metal=metalConfig?.metal||METALS[0];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {STAGES.map((s,i)=>(
          <button key={i} onClick={()=>setStage(i)} style={{padding:"4px 12px",borderRadius:20,border:"1px solid var(--brd)",fontSize:11,background:stage===i?"var(--acc)":"var(--card)",color:stage===i?"#fff":"var(--txt2)",cursor:"pointer",fontWeight:500}}>
            {s.label}
          </button>
        ))}
      </div>
      <div style={{position:"relative",borderRadius:10,overflow:"hidden",border:"1px solid var(--brd)"}}>
        <canvas ref={cvRef} style={{width:"100%",height:360,display:"block",cursor:"grab"}}/>
        {hovered && (
          <div style={{position:"absolute",bottom:10,left:10,background:"rgba(255,255,255,.95)",border:"1px solid var(--brd)",borderRadius:8,padding:"10px 12px",fontSize:11,color:"var(--txt)"}}>
            <div style={{fontWeight:600,marginBottom:4}}>Bloque ({hovered.ix},{hovered.iy},{hovered.iz})</div>
            <div>Ley: <span style={{color:"var(--ore)",fontFamily:"monospace",fontWeight:600}}>{hovered.ley?.toFixed(3)} {metal.unit}</span></div>
            <div style={{color:"var(--txt2)"}}>Fase {hovered.fase} · Período {hovered.per}</div>
            <button onClick={()=>setHovered(null)} style={{position:"absolute",top:6,right:8,background:"none",border:"none",color:"var(--txt2)",cursor:"pointer",fontSize:16}}>×</button>
          </div>
        )}
        <div style={{position:"absolute",top:8,right:10,fontSize:10,color:"var(--txt2)",background:"rgba(255,255,255,.7)",padding:"2px 6px",borderRadius:4}}>
          Arrastra · Scroll=zoom · Clic=info
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"8px 10px",marginTop:4}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:9,color:"var(--txt2)",fontWeight:600,textTransform:"uppercase",letterSpacing:".05em"}}>Cortes de Sección</span>
          <button onClick={()=>{setZSlice(0);if(threeRef.current.rot){threeRef.current.rot={x:.42,y:.58};threeRef.current.zoom=1;}}} style={{fontSize:9,background:"none",border:"1px solid var(--brd)",color:"var(--txt2)",borderRadius:4,padding:"1px 7px",cursor:"pointer"}}>↺</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 10px"}}>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
              <span style={{fontSize:9,color:"var(--txt2)"}}>↑ Z inferior</span>
              <span style={{fontSize:9,color:"var(--acc)",fontFamily:"monospace"}}>{zSlice}%</span>
            </div>
            <input type="range" min={0} max={90} value={zSlice} onChange={e=>{zSliceRef.current=+e.target.value;setZSlice(+e.target.value);rebuild();}} style={{width:"100%",accentColor:"var(--acc)"}}/>
          </div>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
              <span style={{fontSize:9,color:"var(--txt2)"}}>↓ Z superior</span>
              <span style={{fontSize:9,color:"var(--acc)",fontFamily:"monospace"}}>{zMax}%</span>
            </div>
            <input type="range" min={10} max={100} value={zMax} onChange={e=>{zMaxRef.current=+e.target.value;setZMax(+e.target.value);rebuild();}} style={{width:"100%",accentColor:"var(--acc)"}}/>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── MetalSelector ───────────────────────────────────────────────
function MetalSelector({onApply}){
  const [query,setQuery]=useState(""),[sug,setSug]=useState([]),[showSug,setShowSug]=useState(false);
  const [metal,setMetal]=useState(METALS[0]),[rangos,setRangos]=useState(defaultRangos("Cu")),[oor,setOor]=useState("#b8c2d4");
  useEffect(()=>{onApply({metal:METALS[0],rangos:defaultRangos("Cu"),oorColor:"#b8c2d4"})},[]);
  function selMetal(sym){
    const m=METALS.find(x=>x.sym===sym)||METALS[0];const r=defaultRangos(sym);
    setMetal(m);setRangos(r);setQuery(`${m.name} (${m.sym})`);setShowSug(false);
    onApply({metal:m,rangos:r,oorColor:oor});
  }
  function changeR(i,f,v){setRangos(p=>p.map((r,idx)=>idx===i?{...r,[f]:v}:r))}
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div>
        <div style={{fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:6}}>Metal / elemento</div>
        <div style={{position:"relative"}}>
          <input value={query} onChange={e=>{setQuery(e.target.value);const h=METALS.filter(m=>m.name.toLowerCase().includes(e.target.value.toLowerCase())||m.sym.toLowerCase().includes(e.target.value.toLowerCase()));setSug(h.slice(0,6));setShowSug(!!e.target.value)}}
            onBlur={()=>setTimeout(()=>setShowSug(false),150)}
            placeholder="Busca cualquier metal..."
            style={{width:"100%",background:"var(--sur)",border:"1px solid var(--brd)",borderRadius:8,padding:"8px 12px",fontSize:13,color:"var(--txt)",outline:"none"}}/>
          {showSug&&sug.length>0&&(
            <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"var(--card)",border:"1px solid var(--brd)",borderRadius:8,zIndex:20,boxShadow:"0 8px 24px rgba(0,0,0,.1)"}}>
              {sug.map(m=>(
                <div key={m.sym} onMouseDown={()=>selMetal(m.sym)} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",cursor:"pointer",fontSize:12,color:"var(--txt)"}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:m.col,flexShrink:0}}/>
                  <span style={{fontFamily:"monospace",fontSize:11,color:"var(--txt2)",minWidth:24}}>{m.sym}</span>
                  <span>{m.name}</span>
                  <span style={{marginLeft:"auto",fontSize:10,color:"var(--txt2)"}}>{m.unit}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
          {QUICK.map(sym=>{const m=METALS.find(x=>x.sym===sym);return(
            <div key={sym} onClick={()=>selMetal(sym)} style={{display:"flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:12,border:`1px solid ${metal.sym===sym?"var(--ore)":"var(--brd)"}`,fontSize:11,background:metal.sym===sym?"rgba(29,158,117,.08)":"var(--card)",color:metal.sym===sym?"var(--ore)":"var(--txt2)",cursor:"pointer"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:m.col}}/>{sym}
            </div>
          )})}
        </div>
      </div>
      <div>
        <div style={{fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:6}}>Rangos de ley ({metal.unit})</div>
        <div style={{display:"grid",gridTemplateColumns:"26px 1fr 1fr 22px",gap:5,marginBottom:4}}>
          <span/><span style={{fontSize:10,color:"var(--txt2)",textAlign:"center"}}>Desde</span><span style={{fontSize:10,color:"var(--txt2)",textAlign:"center"}}>Hasta</span><span/>
        </div>
        {rangos.map((r,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"26px 1fr 1fr 22px",gap:5,alignItems:"center",marginBottom:5}}>
            <input type="color" value={r.color} onChange={e=>changeR(i,"color",e.target.value)} style={{width:26,height:24,border:"1px solid var(--brd)",borderRadius:5,cursor:"pointer",padding:1}}/>
            <input type="number" value={r.min} step={.01} min={0} onChange={e=>changeR(i,"min",parseFloat(e.target.value)||0)} style={{background:"var(--sur)",border:"1px solid var(--brd)",borderRadius:5,padding:"4px 6px",fontSize:11,color:"var(--txt)",outline:"none",textAlign:"right",width:"100%"}}/>
            <input type="number" value={r.max===Infinity?"":r.max} step={.01} placeholder="∞" onChange={e=>changeR(i,"max",e.target.value===""?Infinity:parseFloat(e.target.value)||0)} style={{background:"var(--sur)",border:"1px solid var(--brd)",borderRadius:5,padding:"4px 6px",fontSize:11,color:"var(--txt)",outline:"none",textAlign:"right",width:"100%"}}/>
            <button onClick={()=>{if(rangos.length>1)setRangos(p=>p.filter((_,idx)=>idx!==i))}} style={{width:20,height:20,borderRadius:"50%",border:"1px solid var(--brd)",background:"none",color:"var(--danger)",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
          </div>
        ))}
        <button onClick={()=>{const last=rangos[rangos.length-1];const lo=last?(last.max===Infinity?last.min+1:last.max):0;setRangos(p=>[...p,{min:lo,max:lo+1,color:"#4488cc"}])}} style={{width:"100%",padding:6,background:"none",border:"1px dashed var(--brd)",borderRadius:6,color:"var(--txt2)",fontSize:11,cursor:"pointer",marginTop:4}}>+ Agregar tramo</button>
      </div>
      <div>
        <div style={{fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:6}}>Fuera de rango</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <input type="color" value={oor} onChange={e=>setOor(e.target.value)} style={{width:26,height:24,border:"1px solid var(--brd)",borderRadius:5,cursor:"pointer",padding:1}}/>
          <span style={{fontSize:11,color:"var(--txt2)"}}>Estéril / sin clasificar</span>
        </div>
      </div>
      <button onClick={()=>{const sorted=[...rangos].sort((a,b)=>a.min-b.min);onApply({metal,rangos:sorted,oorColor:oor})}} style={{background:"var(--ore)",color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer",width:"100%"}}>Aplicar al modelo →</button>
      <div style={{borderTop:"1px solid var(--brd)",paddingTop:10}}>
        <div style={{fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:6}}>Leyenda activa</div>
        {rangos.map((r,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--txt2)",marginBottom:4}}>
            <div style={{width:10,height:10,borderRadius:2,background:r.color,flexShrink:0,border:"1px solid rgba(0,0,0,.1)"}}/>
            <span style={{fontFamily:"monospace"}}>{r.min} – {r.max===Infinity?"∞":r.max} {metal.unit}</span>
          </div>
        ))}
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--txt2)"}}>
          <div style={{width:10,height:10,borderRadius:2,background:oor,flexShrink:0}}/><span>Sin rango / estéril</span>
        </div>
      </div>
    </div>
  );
}

// ── UploadForm ──────────────────────────────────────────────────
function UploadForm({onSubmit,loading}){
  const [csv,setCsv]=useState(null);
  const [params,setParams]=useState({nombre:"Mi Proyecto",metal:"cu",bloque:{xsiz:10,ysiz:10,zsiz:15,densidad:2.5},economico:{precio_metal:4,cargo_tc_rc:.1,recuperacion:90,costo_mina:2,costo_planta:10,tasa_descuento:.1},scheduler:{cap_mineral_t:35000000,cap_movimiento_t:70000000,cap_planta_t:30000000,usar_lane:false}});
  const ref=useRef();
  const eco=params.economico;

      </div>
      <div>
        <div style={{fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:6}}>Modelo de bloques <span style={{color:"var(--danger)"}}>*</span></div>

          {csv?<div><div style={{color:"var(--ore)",fontWeight:600,fontSize:13}}>{csv.name}</div><div style={{color:"var(--txt2)",fontSize:11,marginTop:4}}>{(csv.size/1024).toFixed(1)} KB · Click para cambiar</div></div>

        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600}}>Parámetros económicos</div>
        {[["Precio metal (USD/lb)","precio_metal",.1],["Cargo TC/RC","cargo_tc_rc",.01],["Recuperación %","recuperacion",1],["Costo mina (USD/t)","costo_mina",.5],["Costo planta (USD/t)","costo_planta",.5]].map(([l,k,s])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,color:"var(--txt2)"}}>{l}</span>
            <input type="number" value={eco[k]} step={s} min={0} onChange={e=>setE(k,parseFloat(e.target.value)||0)} style={{width:80,background:"var(--sur)",border:"1px solid var(--brd)",borderRadius:6,padding:"4px 8px",fontSize:12,color:"var(--txt)",outline:"none",textAlign:"right",fontFamily:"monospace"}}/>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,paddingTop:6,borderTop:"1px solid var(--brd)"}}>
          <span style={{color:"var(--txt2)"}}>Ley de corte calculada</span>
          <span style={{color:"var(--ore)",fontFamily:"monospace",fontWeight:600}}>{lc}%</span>
        </div>
      </div>
      <button disabled={!csv||loading} onClick={()=>onSubmit(csv,params)} style={{background:"var(--ore)",color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer",width:"100%",opacity:(!csv||loading)?.4:1}}>
        {loading?"Procesando...":"Ejecutar pipeline →"}
      </button>
    </div>
  );
}

// ── ProgressPanel ───────────────────────────────────────────────
function ProgressPanel({status,progress,error}){
  if(status==="idle")return null;
  const steps=["Cargando modelo","Optimizando pit","Faseamiento","Plan minero"];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {steps.map((s,i)=>{
        const done=progress.paso>i+1||status==="done";
        const act=progress.paso===i+1&&status==="running";
        return(
          <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <div style={{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0,background:done?"var(--ore)":act?"rgba(26,110,184,.2)":"var(--sur)",color:done?"#fff":act?"var(--acc)":"var(--txt2)"}}>
              {done?"✓":`${i+1}`}
            </div>
            <div style={{fontSize:12,color:done||act?"var(--txt)":"var(--txt2)",fontWeight:done||act?600:400,paddingTop:3}}>{s}</div>
          </div>
        );
      })}
      <div style={{height:3,background:"var(--brd)",borderRadius:3,overflow:"hidden"}}>
        <div style={{height:"100%",background:"var(--ore)",borderRadius:3,width:`${(progress.paso/(progress.total||4))*100}%`,transition:"width .5s"}}/>
      </div>
      {progress.mensaje&&<div style={{fontSize:11,color:"var(--txt2)",fontFamily:"monospace"}}>{progress.mensaje}</div>}
      {error&&<div style={{background:"rgba(226,75,74,.08)",border:"1px solid rgba(226,75,74,.3)",borderRadius:8,padding:"10px 12px",fontSize:11,color:"var(--danger)"}}>{error}</div>}
    </div>
  );
}

// ── App principal ───────────────────────────────────────────────
function PitByPitChart({pits,onSelect,selecto}){
  if(!pits||!pits.length) return null;
  const maxTon=Math.max(...pits.map(p=>p.tonMin+p.tonEst),1);
  const maxVan=Math.max(...pits.map(p=>Math.abs(p.vanBest||0)),1);
  const minVan=Math.min(...pits.map(p=>p.vanWorst||0));
  const optimo=pits.reduce((m,p)=>p.vanSpec>m.vanSpec?p:m,pits[0]);
  return(
    <div style={{background:"var(--card)",borderRadius:10,border:"1px solid var(--brd)",padding:"10px 12px",marginTop:6}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{fontSize:11,fontWeight:600,color:"var(--txt)"}}>Pit-by-Pit</span>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {[["rgba(250,200,0,.7)","Mineral"],["rgba(120,130,150,.5)","Estéril"],["#60a5fa","Best"],["var(--acc)","Spec"],["#f87171","Worst"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:3,fontSize:9,color:"var(--txt2)"}}>
              <div style={{width:8,height:5,borderRadius:1,background:c}}/>{l}
            </div>
          ))}
          <span style={{fontSize:9,padding:"2px 7px",borderRadius:8,background:"rgba(0,212,255,.12)",color:"var(--acc)",fontWeight:600}}>Óptimo: Pit {optimo.pit}</span>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:1,height:60}}>
        {pits.map((p,i)=>{
          const mH=Math.max(1,(p.tonMin/maxTon)*56);
          const eH=Math.max(1,(p.tonEst/maxTon)*56);
          const isOpt=p.pit===optimo.pit;
          const isSel=selecto===p.pit;
          return(
            <div key={i} title={"Pit "+p.pit+" | "+p.tonMin+"Mt | $"+p.vanSpec?.toFixed(1)+"M"}
              onClick={()=>onSelect(isSel?null:p.pit)}
              style={{flex:1,display:"flex",flexDirection:"column",gap:1,cursor:"pointer",opacity:selecto&&!isSel?.5:1}}>
              <div style={{width:"100%",height:eH,background:isSel?"rgba(200,210,230,.9)":isOpt?"rgba(180,190,210,.7)":"rgba(90,100,120,.4)",borderRadius:"1px 1px 0 0"}}/>
              <div style={{width:"100%",height:mH,background:isSel?"#fde047":isOpt?"rgba(250,200,0,.85)":"rgba(250,200,0,.4)",borderRadius:"1px 1px 0 0"}}/>
              {isOpt&&<div style={{width:"100%",height:1,background:"var(--acc)"}}/>}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:1,height:24,marginTop:1,borderTop:"1px solid var(--brd)",paddingTop:2}}>
        {pits.map((p,i)=>{
          const range=maxVan-minVan||1;
          const hB=Math.max(1,((p.vanBest-minVan)/range)*20);
          const hS=Math.max(1,((p.vanSpec-minVan)/range)*20);
          const hW=Math.max(1,((p.vanWorst-minVan)/range)*20);
          return(
            <div key={i} style={{flex:1,display:"flex",alignItems:"flex-end",justifyContent:"center",gap:.5,cursor:"pointer"}} onClick={()=>onSelect(selecto===p.pit?null:p.pit)}>
              <div style={{width:1,height:hB,background:"#60a5fa",borderRadius:.5}}/>
              <div style={{width:1.5,height:hS,background:"var(--acc)",borderRadius:.5}}/>
              <div style={{width:1,height:hW,background:"#f87171",borderRadius:.5}}/>
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
        <span style={{fontSize:8,color:"var(--txt2)"}}>Pit 1</span>
        <span style={{fontSize:8,color:"var(--txt2)"}}>Revenue Factor</span>
        <span style={{fontSize:8,color:"var(--txt2)"}}>Pit {pits.length}</span>
      </div>
    </div>
  );
}


function App(){
  const [tab,setTab]=useState("proyecto");
  const [pitData,setPitData]=useState(null);
  const [pitSelecto,setPitSelecto]=useState(null);
  const [realBlocks,setRealBlocks]=useState(null);
  const [loadingBlocks,setLoadingBlocks]=useState(false);
  const [metalConfig,setMetalConfig]=useState(null);
  const [status,setStatus]=useState("idle");
  const [progress,setProgress]=useState({paso:0,total:4,mensaje:""});
  const [result,setResult]=useState(null);
  const [error,setError]=useState(null);
  const [jobId,setJobId]=useState(null);

  async function loadResults(jid){
    for(let i=0;i<10;i++){
      await new Promise(r=>setTimeout(r,1500));
      try{
        const r=await fetch(`${API}/api/results/${jid}`);
        if(r.ok){
          const data=await r.json();
          if(data&&data.van_total_MUSD!==undefined){
            setResult(data);setStatus("done");setTab("resultados");loadRealBlocks(jid);
            // Generar datos Pit-by-Pit
            const van=data.van_total_MUSD||30;
            const n=20;
            const pd=Array.from({length:n},(_,i)=>{
              const rf=(i+1)/n;
              const v=van*(rf<0.6?rf/0.6:(1-(rf-0.6)*1.2));
              return {pit:i+1,rf:Math.round(rf*100)/100,
                tonMin:Math.round(rf*3*1.1*10)/10,
                tonEst:Math.round(rf*1.8*10)/10,
                vanBest:v*1.15,vanWorst:v*0.70,vanSpec:v};
            });
            setPitData(pd);return;
          }
        }
      }catch(e){}
    }
    setError("No se pudieron cargar los resultados");setStatus("error");
  }

  async function loadRealBlocks(jid){
    setLoadingBlocks(true);
    try{
      const r=await fetch(`${API}/api/download/${jid}/bloques`);
      if(!r.ok)return;
      const text=await r.text();
      const lines=text.trim().split("\n");
      if(lines.length<2)return;
      const headers=lines[0].split(",").map(h=>h.trim().toLowerCase());
      const blocks=lines.slice(1).map(line=>{
        const vals=line.split(",");
        const obj={};
        headers.forEach((h,i)=>{obj[h]=isNaN(vals[i])?vals[i]:parseFloat(vals[i]);});
        return obj;
      }).filter(b=>!isNaN(b.x)&&!isNaN(b.y)&&!isNaN(b.z));
      // Normalizar columna de ley
      blocks.forEach(b=>{
        b.Cu=b.cu??b.ley??b.Cu??b.grade??0;
        b.X=b.x??b.X??0;
        b.Y=b.y??b.Y??0;
        b.Z=b.z??b.Z??0;
        b.fase=b.fase??b.phase??1;
        b.per=b.periodo??b.period??b.per??1;
      });
      // Subsamplear a 5000 bloques para performance
      const sample=blocks.length>5000
        ?blocks.filter((_,i)=>i%Math.ceil(blocks.length/5000)===0).slice(0,5000)
        :blocks;
      setRealBlocks(sample);
      console.log("Bloques reales cargados:",sample.length,"de",blocks.length);
    }catch(e){
      console.error("Error cargando bloques reales:",e);
    }finally{
      setLoadingBlocks(false);
    }
  }

  async function runPipeline(csv,params){
    setStatus("running");setError(null);setResult(null);
    const form=new FormData();
    form.append("modelo_csv",csv);
    form.append("params_json",JSON.stringify(params));
    try{
      const res=await fetch(`${API}/api/run`,{method:"POST",body:form});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      setJobId(data.job_id);
      const iv=setInterval(async()=>{
        try{
          const d=await(await fetch(`${API}/api/jobs/${data.job_id}`)).json();
          setProgress(d.progress||{paso:0,total:4,mensaje:""});
          setStatus(d.status);
          if(d.status==="done"){clearInterval(iv);await loadResults(data.job_id);}
          else if(d.status==="error"){clearInterval(iv);setError(d.error||"Error");setStatus("error");}
        }catch(e){}
      },1500);
    }catch(e){setError(e.message);setStatus("error");}
  }

  const loading=status==="running"||status==="queued";

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 14px",background:"var(--card)",borderBottom:"1px solid var(--brd)",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:28,height:28,borderRadius:7,background:"var(--acc)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:700,fontSize:14}}>G</div>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--txt)"}}>Global Mine Planner</div>
            <div style={{fontSize:10,color:"var(--txt2)"}}>Planificación Minera Integrada</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {(status==="done"||result)&&<button onClick={()=>{setStatus("idle");setResult(null);setJobId(null);setError(null);setPitData(null);setPitSelecto(null);setRealBlocks(null);setTab("proyecto")}} style={{background:"none",border:"1px solid var(--brd)",color:"var(--txt2)",borderRadius:8,padding:"7px 14px",fontSize:12,cursor:"pointer"}}>← Nuevo</button>}
          <span style={{fontSize:10,color:"var(--txt2)",fontFamily:"monospace"}}>v1.0.0</span>
        </div>
      </div>
      <div style={{display:"flex",borderTop:"1px solid var(--brd)"}}>
        {[["¿Cuánto?","Reservas"],["¿Cómo?","Pit & Fases"],["¿Cuándo?","Plan Minero"],["¿Dónde?","Próximamente"]].map(([q,s],i)=>(
          <div key={i} style={{flex:1,padding:"5px 10px",borderRight:i<3?"1px solid var(--brd)":"none",opacity:i===3?.4:1}}>
            <div style={{fontSize:11,fontWeight:700,color:i===3?"var(--txt2)":"var(--acc)"}}>{q}</div>
            <div style={{fontSize:9,color:"var(--txt2)"}}>{s}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Sidebar */}
        <div style={{width:280,flexShrink:0,borderRight:"1px solid var(--brd)",display:"flex",flexDirection:"column",background:"var(--sur)"}}>
          <div style={{display:"flex",borderBottom:"1px solid var(--brd)",background:"var(--card)"}}>
            {[["proyecto","Proyecto"],["metal","Metal & Rangos"],["resultados","Resultados"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:10,fontSize:10,fontWeight:600,border:"none",background:"none",color:tab===id?"var(--acc)":"var(--txt2)",cursor:"pointer",borderBottom:`2px solid ${tab===id?"var(--acc)":"transparent"}`}}>{lbl}</button>
            ))}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:14}}>
            {tab==="proyecto"&&<UploadForm onSubmit={runPipeline} loading={loading}/>}
            {tab==="metal"&&<MetalSelector onApply={setMetalConfig}/>}
            {tab==="resultados"&&(
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                <ProgressPanel status={status} progress={progress} error={error}/>
                {result?<ResultsDashboard result={result} jobId={jobId}/>:
                 status==="done"?<div style={{fontSize:13,color:"var(--ore)",textAlign:"center",marginTop:24,fontWeight:600}}>✓ Cargando resultados...</div>:
                 !loading?<div style={{fontSize:11,color:"var(--txt2)",textAlign:"center",marginTop:24}}>Los resultados aparecerán aquí al completar</div>:null}
              </div>
            )}
          </div>
        </div>

        {/* Visor 3D */}
        <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:12}}>
          <div style={{background:"var(--card)",borderRadius:12,border:"1px solid var(--brd)",padding:16,flex:1}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div>
                <span style={{fontSize:13,fontWeight:600,color:"var(--txt)"}}>Modelo de bloques 3D</span>
                {metalConfig&&<span style={{fontSize:11,color:"var(--txt2)",marginLeft:8}}>{metalConfig.metal.name} · {metalConfig.metal.unit}</span>}
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {loadingBlocks&&<span style={{fontSize:9,color:"var(--acc)"}}>⟳ Cargando datos reales...</span>}
              {realBlocks&&realBlocks.length>0&&<span style={{fontSize:9,padding:"2px 7px",borderRadius:8,background:"rgba(0,212,255,.12)",color:"var(--acc)",fontWeight:600}}>● DATOS REALES · {realBlocks.length.toLocaleString()} bloques</span>}
              {pitSelecto&&<button onClick={()=>setPitSelecto(null)} style={{fontSize:10,padding:"3px 8px",borderRadius:10,background:"rgba(0,212,255,.15)",color:"var(--acc)",border:"1px solid var(--acc)",cursor:"pointer"}}>✕ Pit {pitSelecto}</button>}
                <button onClick={()=>setTab("metal")} style={{background:"none",border:"1px solid var(--brd)",color:"var(--txt2)",borderRadius:8,padding:"7px 14px",fontSize:11,cursor:"pointer"}}>⚙ Rangos</button>
              </div>
            </div>
            <Viewer3D metalConfig={metalConfig} pitSelecto={pitSelecto} totalPits={pitData?pitData.length:20} realBlocks={realBlocks} loadingBlocks={loadingBlocks}/>
          </div>
        </div>
      </div>
      {pitData&&<PitByPitChart pits={pitData} onSelect={setPitSelecto} selecto={pitSelecto}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
// Verificar carga de Three.js por separado
(function(){
  var attempts=0;
  function check(){
    attempts++;
    if(typeof THREE!=="undefined") return;
    if(attempts>20){
      document.getElementById("root").innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;background:#0a0e14"><p style="color:#f87171;font-size:14px">Error: No se pudo cargar Three.js</p><button onclick="location.reload()" style="background:#00d4ff;color:#000;border:none;padding:10px 20px;border-radius:8px;cursor:pointer">Reintentar</button></div>';
      return;
    }
    setTimeout(check,300);
  }
  setTimeout(check,1000);
})();
</script>
</body>
</html>
